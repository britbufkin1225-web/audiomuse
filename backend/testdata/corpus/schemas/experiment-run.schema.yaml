schema: audiomuse-experiment-run
version: 1
description: Strict contract for one planned or performed execution of an AudioMuse experiment.
required: [id, experiment_id, run_date, status, environment_notes, equipment, software, procedure_deviations, control_settings, observations, measurements, limitations, safety_notes, interpretation, follow_up_questions, source_refs]
properties:
  id: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
  experiment_id: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
  run_date: { type: [string, "null"], format: date }
  status: { type: string, enum: [planned, completed, incomplete, invalid] }
  environment_notes: { type: array, items: { type: string } }
  equipment: { type: array, items: { type: string } }
  software: { type: array, items: { type: string } }
  procedure_deviations: { type: array, items: { type: string } }
  control_settings:
    type: array
    items:
      type: object
      required: [quantity, value, unit, context]
      properties:
        quantity: { type: string }
        value: { type: [number, string] }
        unit: { type: [string, "null"] }
        context: { type: string }
      additional_properties: false
  observations:
    type: array
    items:
      type: object
      required: [statement, context]
      properties:
        statement: { type: string }
        context: { type: string }
      additional_properties: false
  measurements:
    type: array
    items:
      type: object
      required: [quantity, value, unit, method, tool, calibration, uncertainty, limitations]
      properties:
        quantity: { type: string }
        value: { type: number }
        unit: { type: string }
        method: { type: string }
        tool: { type: string }
        calibration: { type: string, enum: [known, unknown, not-applicable] }
        uncertainty: { type: [string, "null"] }
        limitations: { type: array, items: { type: string } }
      additional_properties: false
  limitations: { type: array, items: { type: string } }
  safety_notes: { type: array, items: { type: string } }
  interpretation: { type: array, items: { type: string } }
  follow_up_questions: { type: array, items: { type: string } }
  source_refs: { type: array, items: { type: string } }
additional_properties: false
