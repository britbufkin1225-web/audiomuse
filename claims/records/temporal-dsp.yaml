id: "stutter-rate-crosses-perceptual-category-boundaries"
statement: "AudioMuse proposes that shortening the repeat period of a musical stutter carries the result across perceptual category boundaries, from discrete repetition to rhythm, then to flutter and roughness, and then to a pitch determined by the repeat rate rather than by the source."
claim_type: "hypothesis"
confidence: "low"
confidence_basis: "The rate boundaries come from a retrieved technical reference, but that reference measured amplitude-modulated tones rather than looped recorded material. Extending the continuum from a modulated sine tone to an arbitrary musical fragment is an untested extrapolation, so the claim is proposed rather than asserted and is graded low rather than moderate."
dispute_status: "undisputed"
temporal_precision: "not_temporal"
evidence: [{"relation": "supported_by", "source_id": "head-acoustics-psychoacoustic-analyses", "note": "Supplies the boundaries the hypothesis extends: tracking of individual variations below about 10 Hz, roughness between roughly 20 and 300 Hz, and resolution of sidebands above that band."}, {"relation": "qualified_by", "source_id": "head-acoustics-psychoacoustic-analyses", "note": "Those figures are given for amplitude-modulated tones at stated carrier frequencies, which bounds the extrapolation to looped recorded material."}]
