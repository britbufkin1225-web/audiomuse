id: "temporal-operations-share-event-boundaries-as-their-target"
statement: "Gating, chopping, stuttering, micro-looping, retriggering, dropout, silence insertion, temporal displacement, and granular fragmentation are usefully treated as one family, because each acts on where events begin, how long they last, and where the next one arrives rather than on spectral content."
claim_type: "interpretation"
confidence: "moderate"
confidence_basis: "This is a frame AudioMuse adopts rather than a result any source reports. It is grounded in sourced material — a modulation-rate continuum that all the operations traverse, a temporal-accent mechanism they all exploit, and a session record treating composition as expectation management — but a competent reader could organize the same operations by technology or by era without contradicting any source, which is why it is typed as an interpretation and not raised above moderate."
dispute_status: "undisputed"
temporal_precision: "not_temporal"
evidence: [{"relation": "supported_by", "source_id": "head-acoustics-psychoacoustic-analyses", "note": "Supplies the modulation-rate continuum shared by every operation in the family whose rate can be swept."}, {"relation": "supported_by", "source_id": "session-02-what-is-music", "note": "Establishes the repetition-to-expectation mechanism that gives event boundaries their musical consequence."}]
