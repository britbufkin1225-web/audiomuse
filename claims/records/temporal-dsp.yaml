id: "performed-and-programmed-temporal-operations-are-different-stimuli"
statement: "A temporal operation performed by hand and the same operation programmed in software are different stimuli rather than the same idea at different precisions, because the performed version carries a distribution of timing offsets and the programmed version is exact."
claim_type: "audiomuse_synthesis"
confidence: "moderate"
confidence_basis: "Two sourced components support it: a retrieved study in which exact repetition produced a perceptual transformation that slight transposition prevented, and the existing AudioMuse node prose recording that a chop performed against a moving record carries the performer's timing while a software slice does not. Whether the difference is perceptually consequential in music has not been tested, which keeps this at moderate."
dispute_status: "undisputed"
temporal_precision: "not_temporal"
evidence: [{"relation": "supported_by", "source_id": "deutsch-speech-to-song-illusion", "note": "Demonstrates a case where exactness of repetition was necessary for a perceptual effect, and slight alteration removed it."}]
