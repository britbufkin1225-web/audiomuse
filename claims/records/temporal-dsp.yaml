id: "dropout-strength-depends-on-the-prediction-it-breaks"
statement: "AudioMuse proposes that the perceptual force of a dropout depends on the strength of the expectation it interrupts rather than on its own duration, so the same silence placed in an established groove and in an unpatterned passage are different events."
claim_type: "hypothesis"
confidence: "low"
confidence_basis: "The expectation half is sourced: a session record establishes that a repeated pattern builds an expectation that can be interrupted, and a retrieved review describes emotion induced by confirmation, delay, or violation of style-based expectations. The specific proportionality between prediction strength and perceptual force is proposed and untested, which caps this at low."
dispute_status: "undisputed"
temporal_precision: "not_temporal"
evidence: [{"relation": "supported_by", "source_id": "session-02-what-is-music", "note": "Establishes that once a pattern repeats a listener forms an expectation which can be fulfilled, delayed, modified, interrupted, or violated."}, {"relation": "supported_by", "source_id": "juslin-brecvema-unified-theory", "note": "Describes musical expectancy as emotion induced when a feature violates, delays, or confirms expectations formed from previous experience of a style."}]
