id: "compressor-release-becomes-a-rhythmic-modulation"
statement: "AudioMuse proposes that a compressor's release time functions as a rhythmic parameter, because gain recovery after each reduction produces a periodic level contour at the rate of the material triggering it, placing the resulting pumping in the same modulation-rate territory as any other periodic envelope variation."
claim_type: "hypothesis"
confidence: "low"
confidence_basis: "The signal-level reasoning is straightforward and the modulation-rate framing is sourced from a retrieved technical reference that locates fluctuation strength near 4 Hz. What is entirely unsourced is any listener response to compression settings, so the affective and groove-related half of the proposal rests on nothing retrieved and the claim is graded low."
dispute_status: "undisputed"
temporal_precision: "not_temporal"
evidence: [{"relation": "supported_by", "source_id": "head-acoustics-psychoacoustic-analyses", "note": "Places the maximum of fluctuation strength near a 4 Hz modulation rate, which is the region a beat-rate pumping cycle occupies at common dance tempi."}]
