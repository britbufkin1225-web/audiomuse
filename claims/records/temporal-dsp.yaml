id: "micro-loop-period-generates-its-own-periodicity"
statement: "AudioMuse proposes that a sufficiently short loop generates a periodicity at the loop rate, including harmonics of that rate produced by the discontinuity at the loop point, so that the perceived pitch of a very short loop is a property of the operation rather than of the material."
claim_type: "hypothesis"
confidence: "low"
confidence_basis: "The reasoning is elementary — a loop of period T repeats at 1 over T, and a hard splice is a periodic discontinuity — and the session record establishes that frequency follows from the rate at which cycles pass. What is not evidenced is the perceptual half: no retrieved source measures the pitch listeners hear from short loops of recorded material. Low rather than moderate for that reason."
dispute_status: "undisputed"
temporal_precision: "not_temporal"
evidence: [{"relation": "supported_by", "source_id": "session-01-what-is-sound", "note": "Establishes that frequency is set by the rate at which cycles pass, which is what makes a loop period a frequency."}, {"relation": "qualified_by", "source_id": "head-acoustics-psychoacoustic-analyses", "note": "Bounds the region in which periodic envelope variation is heard as roughness rather than as separate events or as resolved tones."}]
