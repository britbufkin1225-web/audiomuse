id: "sustained-rate-reduction-moves-several-affective-variables-together"
statement: "Because changing playback rate scales duration and frequency together, sustained slowing simultaneously lowers register, lengthens envelope timing, and redistributes spectral energy, so any affective consequence of slowed playback cannot be attributed to a single one of those changes."
claim_type: "audiomuse_synthesis"
confidence: "moderate"
confidence_basis: "The coupling is an existing AudioMuse technical claim, and the affective relevance of register, envelope, and spectral distribution as separate variables is sourced from a retrieved study of instrument tones. Combining them into a statement about slowed playback specifically is AudioMuse's inference, and the underlying study used isolated orchestral tones rather than slowed recordings, so this is graded moderate."
dispute_status: "undisputed"
temporal_precision: "not_temporal"
evidence: [{"relation": "supported_by", "source_id": "mcadams-affective-qualities-instrument-sounds", "note": "Reports that register, envelope timing, and spectral distribution relate to affective ratings through different descriptor combinations, which is what makes their simultaneous movement non-separable."}, {"relation": "qualified_by", "source_id": "mcadams-affective-qualities-instrument-sounds", "note": "The authors state that isolated tones were used and the relationships should be validated in musical context, which bounds the transfer to slowed recordings."}]
