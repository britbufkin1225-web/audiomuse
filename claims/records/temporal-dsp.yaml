id: "removing-material-creates-perceptual-accent"
statement: "Removing or withholding material accents what remains around it, because an onset not closely followed by another onset is perceived as accented, so a gate, a chop, or an inserted silence can produce emphasis without any change in level."
claim_type: "audiomuse_synthesis"
confidence: "moderate"
confidence_basis: "The accent mechanism is sourced from a retrieved study that established it with pitch and loudness held constant. What AudioMuse adds is the inverse reading — that operations which remove material therefore create accents — which no source states and which is the reason this is typed as synthesis and held at moderate."
dispute_status: "undisputed"
temporal_precision: "not_temporal"
evidence: [{"relation": "supported_by", "source_id": "grahn-brett-beat-perception-motor", "note": "States that an onset not closely followed by another onset is perceived as accented, with pitch and volume held constant."}]
