id: "exact-repetition-can-transform-speech-into-song"
statement: "Deutsch, Henthorn, and Lapidis report that a spoken phrase repeated without any alteration to the signal came to be heard as sung rather than spoken, and that listeners who heard ten presentations repeated the phrase back as song while listeners who heard one repeated it back as speech."
