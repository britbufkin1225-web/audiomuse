id: "expectation-violation-endings"
title: "Expectation Violation Endings"
status: "proof"
type: "listening"
difficulty: "intermediate"
purpose: "Hold a musical sequence constant and change only its final event — expected, delayed, omitted, harmonically unexpected, or rhythmically displaced — so that five kinds of expectation event can be compared against one baseline."
node_refs: ["musical-expectation", "predictive-processing-music", "temporal-discontinuity", "temporal-displacement", "musical-dissonance", "silence-as-musical-material"]
vocabulary_refs: ["expectancy", "prediction-error", "surprise", "uncertainty", "information-content", "entropy", "dropout", "temporal-displacement"]
session_refs: ["session-02-what-is-music"]
source_refs: ["pearce-statistical-learning-enculturation", "juslin-brecvema-unified-theory", "session-02-what-is-music"]
required_equipment: ["a sequencer or DAW", "one instrument sound used for every condition", "headphones or monitors", "rating sheet prepared in advance"]
optional_equipment: ["a second listener rating independently", "a means of recording response time"]
safety: ["Set a conservative monitoring level and do not change it between conditions, since level differences would confound the manipulation.", "Avoid abrupt level jumps at the final event; the manipulation is temporal and harmonic, not dynamic.", "Stop at any discomfort."]
setup: ["Compose one short sequence, at least eight bars, that establishes a clear metre and a clear tonal context, and use it unchanged as the opening of every condition.", "Use one instrument sound throughout and fix its level, so timbre and dynamics cannot vary with condition.", "Prepare rating scales for surprise, tension, and how expected the ending was, and keep those three separate from a fourth scale for liking.", "Randomize condition order and separate repeats of the same condition."]
procedure: ["Condition A, expected: the sequence resolves as its context predicts.", "Condition B, delayed: the same final event arrives one beat late, with the intervening beat left silent.", "Condition C, omitted: the final event does not arrive at all, and the sequence stops.", "Condition D, harmonically unexpected: the final event arrives on time with the expected duration but on an unexpected harmony.", "Condition E, rhythmically displaced: the expected final event arrives early, ahead of the predicted position.", "Rate each condition on all four scales immediately after hearing it."]
observations: ["Record the qualitative difference between the delayed condition and the omitted condition, which differ only in whether the event eventually arrives.", "Record whether the harmonic and the rhythmic violations were described in similar or different terms.", "Note any condition where the listener reported not noticing anything unusual."]
measurements: ["Record the sequence in full, the tempo, the exact displacement in milliseconds and in beats for conditions B and E, and the harmony used in condition D.", "Record the instrument, level, playback chain, and condition order.", "All four scales produce ratings, which are behavioural data and never acoustic measurements."]
expected_behavior: ["All four violation conditions are expected to be rated as more surprising than the baseline; if they are not, the established context was too weak.", "Delay and omission are hypothesized to differ, because a delayed event eventually resolves the prediction and an omitted one does not. This is an AudioMuse hypothesis, not a reported result.", "Reviewed work associates less predictable material with higher arousal and lower valence, so a divergence between the surprise scale and the liking scale would be consistent with that literature."]
interpretation: ["Expectation here is the listener's, formed from their own exposure history, so a listener enculturated to a different tonal system may not experience condition D as a violation at all.", "A single sequence is one sample of one style; nothing about violations in general follows from it.", "Repeated exposure within a session reduces surprise by construction, which is why condition order is randomized and repeats are separated."]
limitations: ["Two variables move together in condition B: the event is late and a silence has been inserted before it. Fully separating them would need a further condition with the intervening beat filled.", "The liking scale is contaminated by the listener's judgement of the composition rather than of the ending.", "One listener cannot distinguish an effect of the manipulation from an effect of that listener's taste.", "No physiological or timing measure is required, so nothing here speaks to arousal directly."]
repeatability: ["Record the full sequence as a file, the tempo, every displacement value, the substituted harmony, the instrument and version, level, playback chain, environment, condition order, and scale wording.", "Record the listener's familiarity with the style, since the whole exercise depends on it."]
related_experiments: ["temporal-gating-and-expectation", "chopped-temporal-reconstruction", "harmonicity-versus-roughness"]
project_connections: ["AudioMuse affective psychoacoustics foundation", "arrangement and drop design", "AudioMuse rhythm and expectation studies"]
