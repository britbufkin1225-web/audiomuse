id: "timbre-emotion-separation"
title: "Timbre and Affect Separation"
status: "proof"
type: "listening"
difficulty: "intermediate"
purpose: "Hold melody, harmony, and tempo fixed while changing only envelope, brightness, distortion, and spectral noise, to test whether affective ratings shift when nothing about the notes has changed."
node_refs: ["affective-timbre", "timbre", "amplitude-envelope", "roughness", "affective-psychoacoustics", "sensory-dissonance"]
vocabulary_refs: ["affective-timbre", "spectral-centroid", "roughness", "valence", "arousal", "sensory-dissonance", "audio-descriptor"]
session_refs: ["session-01-what-is-sound", "session-02-what-is-music"]
source_refs: ["mcadams-affective-qualities-instrument-sounds", "head-acoustics-psychoacoustic-analyses", "session-01-what-is-sound"]
required_equipment: ["a DAW with a synthesizer offering envelope and filter control", "a distortion or saturation processor", "a noise source or noise-mix control", "headphones or monitors", "loudness meter or level meter"]
optional_equipment: ["spectral centroid analysis", "a second listener rating independently"]
safety: ["Match perceived level across conditions before rating, because distortion and brightness both raise loudness and loudness alone changes ratings.", "Set a conservative monitoring level before adding distortion.", "Avoid clipping in the playback chain, which would add an uncontrolled distortion stage to every condition."]
setup: ["Write one short passage and render every condition from that same MIDI performance, so note timing, pitch, and velocity are identical everywhere.", "Fix tempo and do not change it.", "Level-match all conditions by meter and then by ear before any rating takes place, and record the matching method.", "Prepare separate rating scales for valence, energy arousal, and tension arousal, using the three-dimension split the source literature uses rather than a single mood scale.", "Randomize condition order."]
procedure: ["Condition A, baseline: the passage with a neutral patch, moderate attack, no added distortion, no added noise.", "Condition B, attack: the same patch with attack time varied across four settings from very sharp to gentle, holding everything else fixed.", "Condition C, decay: the same patch with decay and release varied across four settings, holding attack fixed.", "Condition D, brightness: the same patch filtered to four cutoff settings spanning dull to bright, level-matched after filtering.", "Condition E, distortion: the same patch through four increasing saturation amounts, level-matched after each.", "Condition F, spectral noise: the same patch with four levels of added broadband noise mixed in, level-matched after each.", "Rate every condition on all three affective scales."]
observations: ["Record whether attack changes moved valence and tension in the same direction or in opposite directions.", "Record whether brightness changes affected energy arousal and tension arousal differently.", "Note any condition where the listener said the passage sounded like different music rather than the same music differently voiced."]
measurements: ["Record every parameter value: attack and decay times in milliseconds, filter cutoff in Hz and slope, saturation amount and processor, noise level in dB relative to the passage.", "Record the level-matching method and the resulting meter readings for each condition.", "If spectral centroid is computed, record the analysis window and hop size alongside the values."]
expected_behavior: ["Published work on isolated instrument tones associated sharper attack with earlier decay with more positive valence, and gentler attacks with higher rated tension; brightness related to both tension arousal and energy arousal. If those relationships appear here, that is consistent with the source. If they do not, the likely reason is that this exercise uses a musical passage and the source used isolated tones.", "Distortion is expected to raise rated roughness-related qualities; it is explicitly not expected to produce any one emotion, and a design that finds it always negative should be suspected of level mismatch."]
interpretation: ["Level matching is the single most important control here. Any uncontrolled loudness difference will dominate every rating and produce a spurious result.", "The source relationships come from isolated orchestral tones and from ratings of the sounds themselves, which sits closer to perceived than to felt emotion.", "A shift in rated affect with notes held constant demonstrates that timbre contributes; it does not demonstrate that timbre determines anything."]
limitations: ["Distortion changes the spectrum, the envelope, and the loudness at once, so it is not a clean single-variable manipulation even after level matching.", "Filtering changes perceived level in a frequency-dependent way that a broadband meter does not fully capture.", "One synthesized passage in one style with one listener supports no generalization.", "No result here transfers to orchestral instruments, which is the corpus the cited source used."]
repeatability: ["Record the MIDI performance, the synthesizer and every patch parameter, the processors and versions, all parameter values, the level-matching procedure and readings, the playback chain, the environment, condition order, and the scale wording."]
related_experiments: ["harmonicity-versus-roughness", "apparent-space-and-affect", "chopped-temporal-reconstruction"]
project_connections: ["AudioMuse affective psychoacoustics foundation", "sound design and patch programming", "mixing and saturation decisions"]
