id: "temporal-gating-and-expectation"
title: "Temporal Gating and Expectation"
status: "proof"
type: "listening"
difficulty: "intermediate"
purpose: "Separate gate rate, duty cycle, gate regularity, and dropout placement as four independent manipulations of one sustained source, and collect ratings that keep perceptual and affective reports apart."
node_refs: ["gating", "temporal-dsp", "temporal-discontinuity", "musical-expectation", "silence-as-musical-material", "amplitude-envelope"]
vocabulary_refs: ["gating", "gate-rate", "duty-cycle", "dropout", "temporal-discontinuity", "perceptual-accent", "expectancy", "surprise"]
session_refs: ["session-02-what-is-music"]
source_refs: ["head-acoustics-psychoacoustic-analyses", "grahn-brett-beat-perception-motor", "session-02-what-is-music"]
required_equipment: ["a DAW or gate plugin with settable rate and duty cycle", "one sustained source of at least 30 seconds", "headphones or monitors", "written rating sheet prepared before listening"]
optional_equipment: ["level meter", "onset detection or waveform display", "a second listener to rate independently"]
safety: ["Set a conservative monitoring level before starting, because hard gating produces transients louder than the sustained material suggests.", "Apply a short fade of a few milliseconds at gate transitions unless the click is deliberately part of the condition being tested.", "Stop at any discomfort; repeated hard transients are fatiguing even at moderate level."]
setup: ["Choose one sustained source and use it unchanged in every condition, so the only difference between conditions is the gate.", "Fix playback level once and do not adjust it between conditions.", "Prepare the rating sheet first, with separate scales for perceived tension, predictability, wanting-to-move, and arousal, and do not add scales after hearing the material.", "Randomize condition order, and if a second listener is available do not discuss ratings until both have finished."]
procedure: ["Condition A, baseline: the ungated source.", "Condition B, gate rate: hold duty cycle at 50 percent and present the source gated at 1 Hz, 4 Hz, 10 Hz, and 20 Hz.", "Condition C, duty cycle: hold rate at 4 Hz and present duty cycles of 75, 50, 25, and 10 percent.", "Condition D, regularity: hold rate and duty cycle at the 4 Hz, 50 percent setting and compare a strictly periodic gate against one whose open positions are irregular but equally frequent.", "Condition E, dropout placement: establish a periodic gate for at least eight cycles, then omit one opening either at a strong metrical position or at a weak one.", "Rate every condition on all four scales immediately after hearing it, before moving on."]
observations: ["Record where in the rate series the gate stopped being heard as rhythm and started being heard as texture or timbre.", "Record whether low duty cycles were described as material with holes or as a new set of events.", "Record the qualitative difference between the two dropout placements in condition E.", "Note any condition where the gate stopped being audible as a separate process."]
measurements: ["Record gate rate in Hz, duty cycle as a percentage, and the exact positions of any omitted openings.", "Record the source, its duration, playback level setting, transition fade time in milliseconds, and the plugin or method used.", "Rate values are behavioural data, not acoustic measurements, and must be recorded as ratings with the scale definition attached."]
expected_behavior: ["Rate and duty cycle should affect the ratings differently, because they are independent parameters; if they do not, the design has confounded them.", "The rate series should cross a perceptual boundary somewhere in its upper range, since the technical reference places roughness rather than separate events above roughly 20 Hz of envelope variation.", "Dropout at a strong metrical position is hypothesized to produce higher rated tension than at a weak one, because more prediction is broken; this is a hypothesis and not a reported finding."]
interpretation: ["A rating is a report by one listener under one condition and generalizes to nothing on its own.", "Any change in rated tension may reflect attention, novelty, or fatigue rather than the manipulated parameter, and repeated exposure within one sitting changes predictability by itself.", "The published inverted-U result relating syncopation to movement and pleasure concerns syncopation, not gating, and may not be transferred to these conditions without evidence."]
limitations: ["Single-listener ratings without counterbalancing across many participants cannot separate the manipulation from order and fatigue effects.", "Familiarity with the source material is uncontrolled unless the source is unfamiliar to every listener.", "Gate implementations differ in transition shape, and transition shape is itself a manipulation this design holds only nominally constant.", "No physiological measure is taken, so nothing here speaks to autonomic response."]
repeatability: ["Record the source file, gate plugin and version, rate, duty cycle, transition fade, playback chain, level, listening environment, condition order, and the exact wording of every rating scale.", "Report the number of listeners and whether they rated independently."]
related_experiments: ["stutter-rate-continuum", "chopped-temporal-reconstruction", "expectation-violation-endings"]
project_connections: ["AudioMuse temporal DSP foundation", "drum programming and arrangement decisions", "DJ crossfader technique"]
