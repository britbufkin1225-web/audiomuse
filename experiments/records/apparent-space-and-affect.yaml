id: "apparent-space-and-affect"
title: "Apparent Space and Affect"
status: "proof"
type: "listening"
difficulty: "intermediate"
purpose: "Hold one source constant and vary apparent distance, reverberation, early reflections, and stereo width, collecting ratings for intimacy, size, and immersion separately from any affective report."
node_refs: ["perceived-space", "auditory-looming", "affective-psychoacoustics", "music-evoked-emotion", "emotion-measurement"]
vocabulary_refs: ["perceived-space", "direct-to-reverberant-ratio", "early-reflections", "auditory-looming", "salience", "brain-stem-reflex"]
session_refs: ["session-01-what-is-sound"]
source_refs: ["ignatiadis-auditory-looming-bias", "session-01-what-is-sound", "mauss-robinson-measures-of-emotion"]
required_equipment: ["a DAW with a reverb offering separate early-reflection and tail control", "one dry mono source recording", "headphones and, if available, monitors", "loudness meter", "rating sheet prepared in advance"]
optional_equipment: ["binaural or HRTF renderer", "second listener rating independently"]
safety: ["Level-match every condition before rating; reverb changes measured and perceived level and would otherwise dominate the result.", "Set a conservative monitoring level, particularly for the approaching-source condition.", "Stop at any discomfort."]
setup: ["Record or select one dry mono source and use it unchanged in every condition.", "Fix the source's own level and match every processed condition back to it by meter and then by ear, recording the method.", "Prepare separate perceptual scales — apparent distance, apparent room size, envelopment — and separate affective scales for valence and arousal, and require both sets to be filled for every condition.", "Note the transducer used, because headphone and speaker presentation differ materially for spatial material, and do not mix the two within one block.", "Randomize condition order."]
procedure: ["Condition A, baseline: the dry source.", "Condition B, distance: four direct-to-reverberant ratios from mostly direct to mostly reverberant, with reverb time held constant.", "Condition C, decay: four reverberation times from short to long, with direct-to-reverberant ratio held constant.", "Condition D, early reflections: the same tail with early reflections absent, sparse, and dense, holding the tail constant.", "Condition E, width: mono, moderate stereo width, and wide, with no other change.", "Condition F, approach: a version in which the direct-to-reverberant ratio moves from reverberant toward direct over several seconds, and a version in which it moves the other way, level-matched to each other.", "Rate every condition on the perceptual scales first, then on the affective scales."]
observations: ["Record whether the perceptual scales moved as intended, which is the check that the manipulation worked at all.", "Record whether the affective scales moved at all, and whether they tracked any perceptual scale.", "Record the qualitative difference between the two directions in condition F."]
measurements: ["Record direct-to-reverberant ratio settings, reverb time in seconds, early-reflection settings, width settings, and the automation curve used in condition F.", "Record the level-matching method and the meter readings for every condition.", "All scales produce ratings, which are behavioural data and never acoustic measurements."]
expected_behavior: ["The perceptual scales should respond clearly; that part rests on well-established cue relationships.", "The affective scales are the open question. AudioMuse has no retrieved source linking reverberation, distance, or width to affective response, so this exercise records a result rather than confirming a prediction.", "Condition F is expected, as a hypothesis only, to show an asymmetry favouring the approaching direction, on the basis that a published looming bias exists for approach cues while holding intensity constant. That result concerned alertness and reaction time, not affect, so any affective asymmetry found here would be a new observation and not a confirmation."]
interpretation: ["A change in rated intimacy is a perceptual report, and it does not become an emotional finding by being described with an emotional word.", "The reviewed measurement literature holds that self-report, physiology, and behaviour carry unique variance and are not interchangeable, so ratings alone bound what this exercise can conclude.", "Spatial impressions are strongly affected by the reproduction system, so a result on headphones is a result on headphones."]
limitations: ["This is the least well-sourced exercise in the Phase 12E set, by design: the affective half rests on no retrieved evidence and is written as a proposal.", "Reverb algorithms differ in ways that no parameter list fully captures, so the same settings on another processor are not the same stimulus.", "Level matching across widely different reverberation amounts is approximate.", "Familiarity with the source material is uncontrolled unless the source is unfamiliar."]
repeatability: ["Record the source file, reverb processor and version, every parameter value, the automation curve, the level-matching method and readings, transducer type and model, environment, condition order, and scale wording."]
related_experiments: ["timbre-emotion-separation", "harmonicity-versus-roughness", "temporal-gating-and-expectation"]
project_connections: ["AudioMuse affective psychoacoustics foundation", "mixing and reverb decisions", "spatial audio study"]
