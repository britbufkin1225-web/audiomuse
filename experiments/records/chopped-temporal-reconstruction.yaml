id: "chopped-temporal-reconstruction"
title: "Chopped Temporal Reconstruction"
status: "proof"
type: "listening"
difficulty: "intermediate"
purpose: "Compare one source against seven temporal reconstructions of it — regular chopping, irregular chopping, retriggering, stutter, reversed fragments, and inserted silence — so that the Phase 12E temporal-DSP layer is tested as a set of related operations rather than one at a time."
node_refs: ["temporal-dsp", "chopping", "retriggering", "stutter", "temporal-discontinuity", "silence-as-musical-material", "temporal-displacement", "musical-expectation"]
vocabulary_refs: ["temporal-dsp", "chopping", "retriggering", "stutter", "temporal-discontinuity", "silence-insertion", "onset-density", "perceptual-accent", "expectancy"]
session_refs: ["session-02-what-is-music", "session-03-history-of-electronic-music"]
source_refs: ["grahn-brett-beat-perception-motor", "deutsch-speech-to-song-illusion", "witek-syncopation-groove-pleasure", "session-02-what-is-music"]
required_equipment: ["a DAW or sampler with sample-accurate editing", "one source passage of at least sixteen bars containing both rhythmic and vocal or melodic material", "headphones or monitors", "loudness meter", "rating sheet prepared in advance"]
optional_equipment: ["onset detection or waveform display", "a second listener rating independently", "two copies of a record and turntables, to compare a performed version against the edited one"]
safety: ["Apply short fades at every edit point unless the click is deliberately part of a condition, since a sixteen-bar passage full of hard splices produces many broadband transients.", "Level-match all conditions before rating; removing material lowers measured level and would otherwise confound every judgement.", "Set a conservative monitoring level and stop at any discomfort."]
setup: ["Choose one source passage and build every condition from that exact audio, with no re-recording between conditions.", "Hold the total duration equal across conditions wherever the operation allows it, and record explicitly where it does not.", "Level-match every condition and record the method and readings.", "Prepare separate scales for predictability, wanting-to-move, tension, and how much the source remained recognizable, plus one for liking kept separate from the rest.", "Randomize condition order and do not present the baseline first."]
procedure: ["Condition A, original: the unedited passage.", "Condition B, regular chopping: the passage cut into equal fragments on a fixed metrical division and reassembled in order.", "Condition C, irregular chopping: the same fragments reassembled with unequal, non-metrical fragment lengths.", "Condition D, retriggering: selected events restarted before completion so their tails never sound, leaving the underlying grid intact.", "Condition E, stutter: one short fragment repeated rapidly at two points in the passage, at a fixed rate recorded in Hz.", "Condition F, reversed fragments: a defined subset of fragments reversed in place, leaving their positions unchanged.", "Condition G, inserted silence: fixed-length silences inserted at defined positions, half at strong metrical positions and half at weak ones.", "Rate every condition on all five scales immediately after hearing it."]
observations: ["Record whether the source remained recognizable in each condition, and which operation degraded recognition most.", "Record whether regular and irregular chopping differed on the wanting-to-move scale specifically.", "Record where inserted silence produced emphasis on surrounding material rather than a sense of absence.", "Record what reversal did to the perceived cause of each event, particularly for vocal material."]
measurements: ["Record every fragment length and position, the stutter rate in Hz and its fragment length in milliseconds, the retrigger positions, the reversed fragment list, and the inserted silence lengths and positions.", "Record onset counts per condition if onset detection is available, since onset density changes across conditions and is one of the few quantities here that can be measured rather than rated.", "Record the level-matching method and readings, the edit fade time, and the software and version."]
expected_behavior: ["Onset density is expected to differ substantially across conditions and is the measurable variable that most obviously distinguishes them.", "Published work reports an inverted U relating syncopation to wanting-to-move and pleasure. Whether chopping sits on that curve at all is an open AudioMuse question, and irregular chopping may fall off it rather than sitting at one end of it.", "Published work also reports that an onset not closely followed by another is perceived as accented, so condition G is expected to accent the material adjacent to each inserted silence.", "Reversal is expected to affect recognition of vocal material more than of percussive material, stated as a hypothesis."]
interpretation: ["Recognition and liking are different scales for a reason: an operation can make material unrecognizable and more engaging at once, and collapsing the two would hide that.", "Any result about chopping here concerns edited chopping. A chop performed by hand against a moving record carries the performer's timing, and the optional turntable comparison exists to make that difference audible rather than to score it.", "This exercise touches material with a specific cultural history. It examines the operations, and it does not stand in for the practice, the scene, or the recordings that developed them."]
limitations: ["Seven conditions in one sitting produce fatigue and order effects that one listener cannot separate from the manipulation.", "Several conditions change onset density and total duration together, so they are not single-variable manipulations.", "The source passage's own structure determines how much each operation can do to it, so a different source may reorder every result.", "No physiological or movement measure is taken, and the wanting-to-move scale is a rating rather than a measurement of movement."]
repeatability: ["Record the source audio, every fragment boundary, all parameter values, edit fade times, level-matching method and readings, software and version, playback chain, environment, condition order, and scale wording.", "If the turntable comparison is performed, record the records used, the deck, and that the performed version cannot be reproduced exactly."]
related_experiments: ["temporal-gating-and-expectation", "stutter-rate-continuum", "expectation-violation-endings"]
project_connections: ["AudioMuse temporal DSP foundation", "AudioMuse Houston chopped-and-screwed foundation", "AudioMuse DJ and turntablism domain"]
