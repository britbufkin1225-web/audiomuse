id: "stutter-rate-continuum"
title: "Stutter Rate Continuum"
status: "proof"
type: "hybrid"
difficulty: "intermediate"
purpose: "Take one fragment and shorten its repeat period continuously, recording where a listener stops hearing discrete repetition and starts hearing rhythm, flutter, roughness, and finally pitch."
node_refs: ["stutter", "micro-looping", "roughness", "temporal-dsp", "repetition", "pitch"]
vocabulary_refs: ["stutter", "micro-looping", "modulation-rate", "roughness", "fluctuation-strength", "grain-density", "speech-to-song-illusion"]
session_refs: ["session-01-what-is-sound"]
source_refs: ["head-acoustics-psychoacoustic-analyses", "deutsch-speech-to-song-illusion", "session-01-what-is-sound"]
required_equipment: ["a sampler, buffer effect, or DAW able to set loop length precisely and sweep it", "one short source fragment", "headphones or monitors", "rating sheet with the five perceptual categories written out in advance"]
optional_equipment: ["spectrum analyzer", "waveform display", "frequency counter"]
safety: ["Reduce level before sweeping: short loops concentrate energy and the perceived loudness rises as the repeat rate enters the audio range.", "Crossfade or window the loop point unless the loop-point click is part of the condition, because repeated hard splices generate broadband content at high rate.", "Stop at any discomfort. Sustained buzzing tones in the tens to hundreds of hertz are fatiguing quickly."]
setup: ["Choose one fragment and use it for the whole series without editing.", "Fix output level once, before the sweep, at the shortest loop length to be used, so later conditions cannot exceed it.", "Write out the five response categories before listening: discrete repetition, rhythm, flutter, buzz or roughness, and pitch.", "Decide the loop lengths in advance and record them as periods in milliseconds and as the corresponding rate in Hz."]
procedure: ["Present the fragment looped at 1000 ms, 500 ms, 250 ms, 125 ms, 100 ms, 50 ms, 25 ms, 10 ms, 5 ms, and 2 ms.", "At each length, classify what is heard into one of the five written categories before moving on.", "Repeat the series in ascending order of loop length to check that the boundaries are not an artifact of sweep direction.", "Repeat the whole series with a second, spectrally different fragment.", "If a spectrum analyzer is available, capture the spectrum at the shortest three lengths and note whether partials appear at multiples of the loop rate."]
observations: ["Record the loop length at which each category boundary was crossed, in both sweep directions.", "Record whether the identity of the source fragment remained recognizable at each length.", "Note whether a pitch was heard, and whether it corresponded to the loop rate rather than to anything in the source."]
measurements: ["Record loop period in milliseconds and the corresponding rate in Hz for every condition.", "Record any observed spectral peaks and their frequencies, with the analyzer settings used.", "Category boundaries are perceptual judgements and must be recorded as observations, not as measured thresholds."]
expected_behavior: ["Boundaries are expected somewhere in the ranges the technical reference gives for envelope modulation: the ear tracking individual events below roughly 10 Hz, roughness rather than separate events from roughly 20 Hz upward, and resolved components above roughly 300 Hz.", "Those numbers come from amplitude-modulated tones, not from looped recorded material, so the transition regions here are AudioMuse hypotheses rather than established thresholds.", "The two source fragments are hypothesized to give different boundaries, because the loop-point discontinuity and the source spectrum both contribute."]
interpretation: ["A boundary reported by one listener on one day is a datum about that listener, not a threshold.", "Any perceived pitch at short loop lengths is generated by the periodicity of the loop itself and is not present in the source, which is the point of the exercise.", "Loudness rises with repeat rate for a fixed fragment because energy is concentrated, so loudness is a confound unless it is controlled or at least recorded."]
limitations: ["Loop-point handling — hard splice, crossfade, or windowing — changes the result and is not held constant across implementations.", "Sweep direction produces hysteresis in categorical judgements, which is why the procedure runs both directions and does not average them.", "The five categories are imposed in advance and may not match what a listener would say unprompted.", "Nothing in this exercise measures affect; the perceptual continuum is the whole of what it addresses."]
repeatability: ["Record the source fragments, loop implementation and version, loop-point treatment, every period tested, sweep order, playback chain, level, and environment.", "Record whether the listener had performed the exercise before, since the category boundaries are learnable."]
related_experiments: ["temporal-gating-and-expectation", "harmonicity-versus-roughness", "chopped-temporal-reconstruction"]
project_connections: ["AudioMuse temporal DSP foundation", "granular and buffer effect design", "beat repeat and loop roll technique"]
