id: "harmonicity-versus-roughness"
title: "Harmonicity versus Roughness"
status: "proof"
type: "hybrid"
difficulty: "intermediate"
purpose: "Vary harmonicity and roughness independently in controlled tone complexes and collect separate ratings for fusion, roughness, and pleasantness, so that a perceptual result and an aesthetic one cannot be recorded as the same judgement."
node_refs: ["harmonicity", "roughness", "sensory-dissonance", "musical-consonance", "musical-dissonance", "affective-psychoacoustics"]
vocabulary_refs: ["harmonicity", "roughness", "sensory-dissonance", "spectral-fusion", "critical-band", "musical-consonance", "musical-dissonance"]
session_refs: ["session-01-what-is-sound", "session-02-what-is-music"]
source_refs: ["mcpherson-amazonian-interval-fusion", "head-acoustics-psychoacoustic-analyses", "session-01-what-is-sound"]
required_equipment: ["an additive or multi-oscillator synthesizer allowing individual partial frequencies to be set", "headphones or monitors", "a rating sheet with three separate scales prepared in advance"]
optional_equipment: ["spectrum analyzer", "roughness analysis software", "a second listener rating independently"]
safety: ["Set a conservative level before combining tones, because summing partials raises output.", "Avoid prolonged exposure to sustained pure-tone complexes and take breaks between blocks.", "Keep clipping and intentional overload out of the signal path, since nonlinearity would add partials and destroy the manipulation."]
setup: ["Fix a common fundamental and a fixed overall level for every condition.", "Prepare three separate rating scales — how strongly the components fuse into one sound, how rough the sound is, and how pleasant it is — and require all three to be answered for every condition.", "Do not label conditions with musical interval names during rating, because the name invokes learned associations the exercise is trying to separate out.", "Randomize condition order."]
procedure: ["Block 1, harmonicity: present complexes whose partials are exact integer multiples of the fundamental, then progressively stretch the partial spacing away from integer ratios in fixed steps, holding the number of partials and the level constant.", "Block 2, roughness by spacing: present pairs of partials separated by 1, 3, 6, 12, 25, and 60 Hz around a 1 kHz region, which moves the pair from slow beating through the roughness region.", "Block 3, roughness by modulation: present a 1 kHz tone amplitude-modulated at 4, 20, 40, 70, and 150 Hz at full modulation depth.", "Block 4, register: repeat block 2 with the same absolute frequency separations around a 200 Hz region and around a 4 kHz region.", "Rate every condition on all three scales before proceeding."]
observations: ["Record whether the fusion rating and the pleasantness rating moved together or independently across block 1.", "Record where in block 2 the sensation changed from beating to roughness.", "Record whether block 4 produced different roughness ratings for identical frequency separations in different registers."]
measurements: ["Record every partial frequency, the modulation frequency and depth, the number of partials, and the output level.", "Record the synthesizer and version used and the exact partial-stretching rule applied in block 1.", "Fusion, roughness, and pleasantness values are ratings, not acoustic measurements, and must be recorded as such alongside the scale wording."]
expected_behavior: ["Block 3 is expected to peak in rated roughness somewhere near a 70 Hz modulation rate for the 1 kHz carrier, following the reference condition the technical source gives for the asper.", "Block 4 is expected to show the same absolute separation producing different roughness in different registers, because critical bandwidth is not constant.", "Fusion and pleasantness are hypothesized to dissociate, following the published finding that fusion did not predict pleasantness even in listeners with strong consonance preferences. Reproducing a dissociation would be consistent with that result; failing to reproduce it in one listener would not refute it."]
interpretation: ["A pleasantness rating is an aesthetic judgement shaped by the listener's exposure history, and the published cross-cultural work is the reason it must be recorded separately from fusion.", "Roughness ratings track a sensation; they do not license any statement about emotion.", "Stretched-partial complexes may be heard as unfamiliar rather than as inharmonic, and unfamiliarity is a confound on the pleasantness scale specifically."]
limitations: ["Synthesized complexes are not music, and no result here transfers to chords in a musical context without further work.", "Headphone and speaker responses differ across the frequency ranges used, and level calibration across registers is approximate without a calibrated chain.", "One listener's pleasantness ratings carry that listener's enculturation and nothing more.", "Any nonlinearity in the playback chain adds partials and silently changes the stimulus."]
repeatability: ["Record all partial frequencies, modulation parameters, levels, synthesizer and version, playback chain, transducer type, listening environment, condition order, and scale wording.", "Record the listener's musical background, since the pleasantness scale is the one it affects."]
related_experiments: ["stutter-rate-continuum", "timbre-emotion-separation", "expectation-violation-endings"]
project_connections: ["AudioMuse affective psychoacoustics foundation", "voicing and arrangement decisions", "distortion and saturation design"]
