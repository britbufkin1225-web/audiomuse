id: "varispeed"
term: "Varispeed"
domain: "recording"
definition: "Continuous adjustment of a playback or record transport's speed, which changes duration and pitch together because both follow from the same transport rate."
digital_relationship: "Its digital equivalent is resampling; software can also break the coupling, which a mechanical transport cannot."
best_use: "Naming coupled speed-and-pitch change on tape or turntable, as opposed to independent time or pitch processing."
