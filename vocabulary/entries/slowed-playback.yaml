id: "time-stretching"
term: "Time Stretching"
domain: "dsp"
definition: "Digital modification of a signal's duration without a corresponding change in pitch, separating two properties that mechanical rate change moves together."
digital_relationship: "Implemented by short-time analysis and resynthesis, classically through the phase vocoder, at the cost of characteristic artifacts."
best_use: "Changing length while holding pitch, and knowing that this is not what a turntable does."
technologies: ["phase vocoder", "DAW time-stretch algorithms", "granular processing"]
