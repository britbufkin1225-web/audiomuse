id: "cassette-duplication"
term: "Cassette Duplication"
domain: "recording"
definition: "The copying of a recorded cassette master onto further cassettes, which made small-scale independent distribution possible without a pressing plant or minimum order."
digital_relationship: "The economic function survives in digital distribution, while the technical constraints of speed, stock, and generational loss do not."
best_use: "Explaining how a tape-based scene distributed music outside the industrial chain."
