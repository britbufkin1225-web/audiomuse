id: "slowed-playback"
term: "Slowed Playback"
domain: "dj-turntablism"
definition: "Sustained reduction of the rate at which a recording is played back, which lengthens duration, lowers pitch, and slows tempo together because all three follow from one rate change."
digital_relationship: "Equivalent to resampling in the digital domain; software can also decouple the effects, which mechanical playback cannot."
best_use: "Describing a whole-performance treatment rather than a momentary rate gesture."
