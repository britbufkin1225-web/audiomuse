id: "resampling"
term: "Resampling"
domain: "dsp"
definition: "Reading stored samples at a different rate than they were recorded at, which scales duration and frequency together and is the digital counterpart of mechanical varispeed."
digital_relationship: "The operation software uses when it deliberately reproduces turntable or tape behavior instead of decoupling time from pitch."
best_use: "Reproducing coupled speed-and-pitch change in the digital domain on purpose."
technologies: ["sample rate conversion", "DAW", "sampler"]
