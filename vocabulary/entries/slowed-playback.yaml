---
id: "pitch-shifting"
term: "Pitch Shifting"
domain: "dsp"
definition: "Digital modification of a signal's pitch without a corresponding change in duration, commonly realized as time stretching followed by resampling back to the original length."
digital_relationship: "A composition of two operations rather than a primitive, which is why its artifacts resemble those of stretching."
best_use: "Moving pitch while holding length, as distinct from changing playback rate."
technologies: ["phase vocoder", "DAW pitch algorithms", "hardware harmonizers"]
