id: "dubbing"
term: "Dubbing"
domain: "recording"
definition: "Copying recorded material from one tape to another, producing a second physical object whose audio is one generation removed from its source."
digital_relationship: "Replaced by file copying, which is exact and lossless, removing the generational degradation that defined analog copying."
best_use: "Naming the copy operation itself, separately from the duplication economy built on it."
