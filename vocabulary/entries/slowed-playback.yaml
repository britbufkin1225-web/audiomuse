id: "generational-loss"
term: "Generational Loss"
domain: "recording"
definition: "Cumulative degradation introduced each time analog material is copied, so a copy of a copy carries more noise and less detail than the master."
digital_relationship: "Absent from lossless digital copying, though repeated lossy re-encoding reintroduces a comparable cumulative degradation."
best_use: "Reasoning about which copy of a recording is actually being heard."
technologies: ["magnetic tape", "cassette deck", "lossy codecs"]
