id: "word-repetition"
term: "Word Repetition"
domain: "rhythm-time"
definition: "Recurrence of a single word or syllable during playback, which holds attention on a semantic unit and delays the line it belongs to while the groove continues."
digital_relationship: "Trivial to produce by slicing a vocal in an editor, which makes the choice of which word to hold the only remaining difficulty."
best_use: "Describing repetition that changes emphasis and meaning rather than rhythm alone."
