id: "duplicate-record-technique"
term: "Duplicate-Record Technique"
domain: "dj-turntablism"
definition: "Playing two copies of the same record on separate decks so a passage can be replayed, extended, or interrupted without waiting for the record to return to that point."
digital_relationship: "Made unnecessary by instant random access in samplers and DAWs, where any point in a file can be triggered immediately."
best_use: "Explaining how repetition was achieved mechanically before random access existed."
