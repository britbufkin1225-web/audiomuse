tags: ["rhythm-time", "perception"]
---
id: "swing"
term: "Swing"
domain: "rhythm-time"
definition: "A deliberate change of subdivision timing that makes consecutive subdivisions unequal rather than evenly spaced."
digital_relationship: "Exposed by drum machines and DAWs as a swing or shuffle amount that displaces subdivisions from the strict grid."
best_use: "Adding rhythmic feel to programmed patterns without performing them by hand."
technologies: ["drum machines", "DAWs", "sequencers"]
node_refs: ["rhythm", "temporal-displacement"]
session_refs: ["session-02-what-is-music"]
related_terms: ["groove", "rhythm", "tempo", "quantization-timing", "temporal-displacement"]
tags: ["rhythm-time", "timing"]
---
id: "quantization-timing"
term: "Quantization (Timing)"
domain: "rhythm-time"
definition: "Alignment of musical events to exact positions on a timing grid."
digital_relationship: "Applied by sequencers and DAWs when recorded or programmed events are snapped to grid positions; the deviation left unquantized is what carries groove."
best_use: "Tightening programmed or performed patterns, and choosing how much timing deviation to preserve."
technologies: ["sequencers", "DAWs", "drum machines"]
node_refs: ["rhythm", "sequencing"]
