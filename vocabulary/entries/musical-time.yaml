id: "groove"
term: "Groove"
domain: "rhythm-time"
definition: "The perceived rhythmic feel created by small timing, velocity, and accent relationships rather than by exact grid positions."
digital_relationship: "Depends on how a sequencer treats microtiming: snapping every event to the grid can remove it, while preserved timing offsets keep it."
best_use: "Programming patterns that feel performed, and deciding how strictly to quantize a take."
technologies: ["sequencers", "DAWs", "drum machines", "samplers"]
node_refs: ["rhythm", "groove", "rhythmic-entrainment"]
session_refs: ["session-02-what-is-music"]
