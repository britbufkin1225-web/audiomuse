id: "affective-timbre"
term: "Affective Timbre"
domain: "psychoacoustics"
definition: "The relationship between spectral and envelope properties and the affective qualities listeners attribute to a sound, in which distinct descriptor combinations relate to distinct affective dimensions."
digital_relationship: "Reachable through brightness, spectral slope, attack, and decay controls, each of which relates to more than one affective dimension rather than to a single one."
best_use: "Choosing which property to change when a sound reads wrong, instead of adjusting everything."
