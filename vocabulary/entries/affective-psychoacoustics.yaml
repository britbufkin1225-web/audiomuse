id: "auditory-scene-analysis"
term: "Auditory Scene Analysis"
domain: "psychoacoustics"
definition: "The process by which a mixture of sound is organized into separate perceived sources, using cues including harmonicity, common onset, spatial position, and continuity."
digital_relationship: "The perceptual problem a mix engineer is really working on, and the reason shared onsets and shared modulation make parts merge."
best_use: "Describing separation and merging of parts as a grouping problem rather than a level problem."
technologies: ["mixing", "source separation", "spectral editing"]
