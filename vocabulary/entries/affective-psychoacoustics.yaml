id: "critical-band"
term: "Critical Band"
domain: "psychoacoustics"
definition: "The frequency region within which components interact rather than being resolved separately, which sets where close-spaced partials produce roughness instead of two distinct pitches."
digital_relationship: "Used implicitly by perceptual codecs and roughness models, and encountered practically whenever a low-register voicing turns muddy."
best_use: "Explaining why interval spacing behaves differently in different registers."
technologies: ["perceptual coding", "roughness models", "filter-bank analysis"]
