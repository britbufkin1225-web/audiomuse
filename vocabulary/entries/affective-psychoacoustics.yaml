id: "perceived-space"
term: "Perceived Space"
domain: "spatial-audio"
definition: "The impression of location, distance, size, and enclosure that a listener infers from timing, level, spectral, and reverberant cues rather than sensing directly."
digital_relationship: "Constructible entirely artificially, because the cues are inferred; reverb, delay, filtering, and level automation supply a room that was never there."
best_use: "Framing a reverb decision as a claim about where the listener is standing."
technologies: ["reverb processors", "binaural rendering", "panning", "microphone placement"]
