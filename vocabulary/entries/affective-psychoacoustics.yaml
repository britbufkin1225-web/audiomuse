id: "musical-consonance"
term: "Musical Consonance"
domain: "music-theory"
definition: "A judgement that simultaneous tones belong together, arising from spectral fusion, peripheral interaction, and learned exposure to a tonal system rather than from any one of them."
digital_relationship: "Cannot be computed from a spectrum alone, because the learned component is a property of the listener rather than of the signal."
best_use: "Naming a judgement with several contributors, rather than asserting an acoustic definition."
technologies: ["voicing", "arrangement", "spectral analysis"]
node_refs: ["musical-consonance", "harmonicity"]
session_refs: ["session-02-what-is-music"]
related_terms: ["musical-dissonance", "sensory-dissonance", "spectral-fusion", "enculturation"]
tags: ["music-theory", "perception"]
---
id: "musical-dissonance"
term: "Musical Dissonance"
domain: "music-theory"
definition: "A judgement that simultaneous tones do not belong together or require resolution, combining peripheral sensory contributions with learned expectations, and carrying no fixed emotional value."
digital_relationship: "Its sensory component changes with processing while the notated interval stays fixed, which is why distortion alters dissonance without altering harmony."
best_use: "Naming instability relative to a context, rather than a property an interval carries around."
technologies: ["distortion", "voicing", "arrangement"]
