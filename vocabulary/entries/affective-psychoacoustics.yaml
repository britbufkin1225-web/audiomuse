---
id: "roughness"
term: "Roughness"
domain: "psychoacoustics"
definition: "A sensation produced by rapid envelope variation within a critical band, occupying a bounded range of modulation rates and peaking near 70 Hz for a 1 kHz carrier."
digital_relationship: "Measurable by hearing-model algorithms in units of asper, and producible by any process that adds close-spaced partials, including distortion and detuning."
best_use: "Naming the sensation, not a judgement about whether the sound is unpleasant."
technologies: ["distortion", "chorus and detuning", "roughness analysis", "amplitude modulation"]
