id: "phase-locking"
term: "Phase Locking"
domain: "psychoacoustics"
definition: "The tendency of auditory nerve fibres to fire preferentially at particular phases of a low-frequency waveform, providing a temporal frequency code that operates up to about 3 kHz in a one-to-one fashion."
digital_relationship: "The biological counterpart of sample-accurate timing, and the reason interaural time differences are usable as a localization cue at low frequencies."
best_use: "Naming the temporal code for frequency, and its upper limit."
technologies: ["binaural rendering", "auditory modelling"]
node_refs: ["auditory-pathway", "auditory-transduction", "phase"]
session_refs: ["session-01-what-is-sound"]
related_terms: ["tonotopy", "auditory-transduction"]
tags: ["psychoacoustics", "biology", "time-domain"]
