id: "programme-loudness"
term: "Programme Loudness"
domain: "mixing-mastering"
definition: "A standardized algorithmic measure of the loudness of an audio programme, specified by ITU-R Recommendation BS.1770 alongside true-peak level."
digital_relationship: "The basis of broadcast and streaming normalization, and a measurement of the signal rather than a report of how loud anyone found it."
best_use: "Naming the standardized measurement, without treating it as equivalent to perceived loudness in a musical context."
