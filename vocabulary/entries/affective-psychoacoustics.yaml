id: "direct-to-reverberant-ratio"
term: "Direct-to-Reverberant Ratio"
domain: "spatial-audio"
definition: "The relationship between the level of sound arriving directly from a source and the level of its reflected energy, one of the primary cues from which listeners infer distance."
digital_relationship: "Set explicitly as a wet/dry balance, which makes apparent distance a mix control rather than a recording condition."
best_use: "Describing a distance decision precisely instead of talking about reverb amount."
technologies: ["reverb processors", "convolution reverb", "microphone placement"]
