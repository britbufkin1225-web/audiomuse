id: "auditory-looming"
term: "Auditory Looming"
domain: "spatial-audio"
definition: "A perceptual asymmetry favouring approaching over receding sound sources, demonstrated with spectral cues while overall intensity is held constant."
digital_relationship: "Approximated by risers, filter sweeps, reverb reduction, and level automation, all of which construct approach cues artificially."
best_use: "Naming the perceptual bias, not an emotional reaction — the evidence concerns alertness and reaction time."
technologies: ["reverb automation", "filter sweeps", "binaural rendering", "HRTF processing"]
