id: "audio-descriptor"
term: "Audio Descriptor"
domain: "machine-audio"
definition: "A number computed from a signal that describes a property of that signal and nothing about a listener."
digital_relationship: "Deterministic given the audio and the extraction method, which is why the method has to be recorded alongside the value."
best_use: "Keeping measured signal properties in a separate column from rated perceptual ones."
