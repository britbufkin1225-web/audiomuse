id: "spectral-centroid"
term: "Spectral Centroid"
domain: "machine-audio"
definition: "The amplitude-weighted mean frequency of a spectrum, a descriptor that correlates with perceived brightness without being identical to it."
digital_relationship: "Computed per analysis frame, and one of the descriptors that related to more than one affective rating dimension in published work."
best_use: "Reporting a measurable spectral property, kept distinct from the perceptual word brightness."
