id: "early-reflections"
term: "Early Reflections"
domain: "spatial-audio"
definition: "The first discrete reflections arriving after the direct sound, whose pattern and delay contribute to impressions of room size and source distance before the diffuse reverberant field develops."
digital_relationship: "Modelled separately from the reverb tail in most processors, which makes size and decay independently adjustable in a way physical rooms do not allow."
best_use: "Naming the cue that carries room size, as distinct from decay time."
technologies: ["algorithmic reverb", "convolution reverb", "room simulation"]
