id: "spectral-flux"
term: "Spectral Flux"
domain: "machine-audio"
definition: "A measure of how much a spectrum changes between successive analysis frames, which in one EEG study predicted neural synchronization to music better than the amplitude envelope did."
digital_relationship: "Used for onset detection and for tracking rhythmic change that level alone does not reveal."
best_use: "Describing rhythmic change that involves timbre rather than only loudness."
