id: "fluctuation-strength"
term: "Fluctuation Strength"
domain: "psychoacoustics"
definition: "The sensation produced by slow envelope variation, peaking near a 4 Hz modulation rate, measured in vacil and distinct from roughness by rate rather than by kind."
digital_relationship: "The region a tremolo, a slow gate, or a pumping compressor operates in, which is also the region of ordinary speech syllable rate."
best_use: "Distinguishing slow modulation, which is tracked as pulsation, from fast modulation, which is not."
technologies: ["tremolo", "slow LFO", "sidechain compression", "psychoacoustic analysis"]
