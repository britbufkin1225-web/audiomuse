id: "dynamic-range"
term: "Dynamic Range"
domain: "mixing-mastering"
definition: "The span between the quietest and loudest parts of a signal, which determines how much room exists for contrast and therefore for dynamic surprise."
digital_relationship: "Reduced deliberately by compression and limiting, which trades available contrast for consistent level."
best_use: "Framing dynamics as available contrast rather than as a fidelity metric."
technologies: ["compressor", "limiter", "loudness meters"]
