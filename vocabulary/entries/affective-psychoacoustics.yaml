id: "harmonicity"
term: "Harmonicity"
domain: "psychoacoustics"
definition: "The degree to which a sound's partials approximate integer multiples of a common fundamental, which governs whether components fuse into one perceived source or separate into several."
digital_relationship: "Manipulable directly by inharmonic synthesis, partial stretching, and ring modulation, and measurable from a spectrum."
best_use: "Predicting fusion, not predicting pleasantness — the two have been shown to dissociate."
technologies: ["additive synthesis", "FM synthesis", "ring modulation", "spectral analysis"]
node_refs: ["harmonicity", "pitch", "musical-consonance"]
