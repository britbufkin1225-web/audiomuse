id: "sensory-dissonance"
term: "Sensory Dissonance"
domain: "psychoacoustics"
definition: "The component of perceived dissonance attributable to interaction between spectral components in the auditory periphery, principally roughness, considered apart from learned musical judgements."
digital_relationship: "Rises sharply with distortion and saturation, because nonlinear processing multiplies the number of close-spaced partial pairs."
best_use: "Separating what the ear does from what a tonal system expects."
technologies: ["distortion", "voicing decisions", "roughness models"]
node_refs: ["sensory-dissonance", "musical-dissonance", "roughness"]
