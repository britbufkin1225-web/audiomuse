id: "auditory-transduction"
term: "Auditory Transduction"
domain: "psychoacoustics"
definition: "The conversion of airborne pressure variation into neural activity by the ear, in which the cochlea decomposes the signal by frequency along its length before anything is computed."
digital_relationship: "Structurally analogous to a filter bank followed by envelope detection, which is why perceptual models of hearing are built that way."
best_use: "Explaining that frequency analysis is mechanical and happens first."
technologies: ["filter-bank models", "perceptual coding", "cochlear implants"]
node_refs: ["auditory-transduction", "auditory-pathway"]
session_refs: ["session-01-what-is-sound"]
related_terms: ["tonotopy", "phase-locking", "critical-band"]
tags: ["psychoacoustics", "biology"]
---
id: "tonotopy"
term: "Tonotopy"
domain: "psychoacoustics"
definition: "Organization by frequency along a physical axis, established mechanically in the cochlea and retained at every level of the central auditory system."
digital_relationship: "The reason a spectrum display corresponds to something real about how hearing is arranged, rather than being only an analytical convenience."
best_use: "Naming the place code for frequency, as distinct from the temporal code."
technologies: ["spectrum analysis", "cochlear implants", "filter banks"]
node_refs: ["auditory-transduction", "auditory-pathway", "frequency"]
session_refs: ["session-01-what-is-sound"]
