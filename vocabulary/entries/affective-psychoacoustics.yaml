related_terms: ["spectral-fusion", "sensory-dissonance", "musical-consonance", "roughness"]
tags: ["psychoacoustics", "spectral"]
---
id: "spectral-fusion"
term: "Spectral Fusion"
domain: "psychoacoustics"
definition: "The perceptual merging of concurrent components into a single source, strongest for simple integer ratios, demonstrated across listeners from very different musical cultures."
digital_relationship: "The reason layered parts in exact ratios disappear into one another, and the reason slight detuning restores their separateness."
best_use: "Naming a grouping outcome, which research has shown does not predict aesthetic preference."
technologies: ["layering", "detuning", "unison stacking"]
node_refs: ["harmonicity", "musical-consonance"]
