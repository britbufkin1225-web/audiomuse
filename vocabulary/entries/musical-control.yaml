term: "MIDI"
domain: "digital-audio"
definition: "A standard protocol that carries musical control instructions such as note, velocity, and channel rather than recorded audio."
digital_relationship: "Structured event messaging: note on, note off, velocity, pitch bend, control changes, and clock travel between devices while the receiving instrument decides the resulting sound."
best_use: "Controlling instruments from a keyboard or sequencer, editing performances as data, and synchronizing equipment from different manufacturers."
