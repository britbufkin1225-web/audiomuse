id: "sequencer"
term: "Sequencer"
domain: "digital-audio"
definition: "A device or program that stores and plays back ordered musical events so patterns repeat and stay editable."
digital_relationship: "Early designs stepped through analog voltages; later ones store digital event data, and MIDI lets one sequencer drive several instruments."
best_use: "Programming drum and melodic patterns, automating repetition, and driving synthesizers and samplers."
