id: "beatgrid"
term: "Beatgrid"
domain: "digital-audio"
definition: "A digital coordinate system for musical time that records where a track's beats fall."
digital_relationship: "Stored as beat positions analyzed from or assigned to an audio file; an incorrect grid breaks synchronization even when the audio itself is intact."
best_use: "Beatmatching and synchronizing tracks, and locating beats and phrase markers during DJ preparation."
