id: "sensorimotor-synchronization"
term: "Sensorimotor Synchronization"
domain: "rhythm-time"
definition: "Coordination of movement with a perceived external rhythm, such as tapping to a beat, which is measurable directly and does not require any claim about neural oscillation."
digital_relationship: "Measured by comparing tap timestamps against detected onsets, which makes it one of the few affect-adjacent measures available without laboratory instrumentation."
best_use: "Naming the measurable behavioural version of locking to a beat."
technologies: ["tapping tasks", "MIDI controllers", "motion capture"]
