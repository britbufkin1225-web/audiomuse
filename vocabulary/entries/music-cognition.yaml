id: "surprise"
term: "Surprise"
domain: "psychoacoustics"
definition: "The listener-side experience of an event that the current model rated as unlikely, associated in reviewed work with higher arousal and lower valence."
digital_relationship: "Depends on the listener's model rather than on the signal, so the same edit surprises one listener and not another."
best_use: "Reporting an experience, with information content as its modelled counterpart."
technologies: ["listening tests", "continuous response interfaces"]
node_refs: ["musical-expectation", "predictive-processing-music"]
