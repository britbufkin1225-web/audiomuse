id: "perceptual-accent"
term: "Perceptual Accent"
domain: "rhythm-time"
definition: "Prominence arising from temporal context alone, with pitch and loudness held constant, such as an onset not closely followed by another onset being heard as accented."
digital_relationship: "Created by any editing operation that changes spacing, which means removing material can accent what remains without touching a level."
best_use: "Explaining emphasis produced by silence and spacing rather than by dynamics."
technologies: ["DAW editing", "step sequencing", "gating"]
