id: "information-content"
term: "Information Content"
domain: "psychoacoustics"
definition: "A measure of how unexpected a particular event is in its context, distinct from how uncertain the prediction was beforehand."
digital_relationship: "Computed from a model's probability for the event that actually occurred, so it depends entirely on which model is used."
best_use: "Naming surprise as a quantity, and keeping it separate from uncertainty."
technologies: ["music prediction models", "corpus analysis"]
node_refs: ["predictive-processing-music", "musical-expectation"]
