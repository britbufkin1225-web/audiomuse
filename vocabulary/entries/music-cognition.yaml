id: "speech-to-song-illusion"
term: "Speech-to-Song Illusion"
domain: "psychoacoustics"
definition: "A perceptual transformation in which an unaltered spoken phrase comes to be heard as sung after exact repetition, and which does not occur if the repetitions are transposed or the syllables jumbled."
digital_relationship: "Depends on exact reproduction, which mechanical performance cannot supply and digital looping can, making it a property of the digital repeat specifically."
best_use: "Demonstrating that repetition alone reorganizes perception, without any change to the signal."
technologies: ["DAW looping", "sampler", "listening tests"]
node_refs: ["repetition", "micro-looping", "temporal-dsp"]
