id: "uncertainty"
term: "Uncertainty"
domain: "psychoacoustics"
definition: "A listener's lack of confidence about what comes next, distinct from surprise because it describes the state before the event rather than the reaction to it."
digital_relationship: "Modelled as entropy, and manipulable by making a passage less predictable without making any single event unlikely."
best_use: "Separating not knowing what is coming from being caught out by what arrived."
technologies: ["listening tests", "prediction models"]
node_refs: ["musical-expectation", "predictive-processing-music"]
