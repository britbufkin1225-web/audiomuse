id: "entrainment"
term: "Entrainment"
domain: "rhythm-time"
definition: "Alignment of an internal periodic process with an external periodicity, used both for bodily and motor alignment and, more contentiously, for neural synchronization."
digital_relationship: "Depends on cues a listener can track, and published EEG work found spectral flux a better predictor of neural synchronization than the amplitude envelope."
best_use: "Stating which sense is meant, because the neural sense is a stronger and disputed claim."
