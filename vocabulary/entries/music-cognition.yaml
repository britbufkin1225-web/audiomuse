id: "emotion-measurement"
term: "Emotion Measurement"
domain: "psychoacoustics"
definition: "The set of methods used to record affective response — self-report, behavioural, physiological, and neural — none of which is a gold standard and none of which is interchangeable with another."
digital_relationship: "Entirely separate from signal measurement; conflating the two is the characteristic error this vocabulary exists to prevent."
best_use: "Forcing a listening result to declare which measure produced it."
