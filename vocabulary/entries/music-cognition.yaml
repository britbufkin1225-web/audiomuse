id: "probabilistic-prediction"
term: "Probabilistic Prediction"
domain: "psychoacoustics"
definition: "Generating expectations about upcoming events as a distribution over possibilities rather than as a single guess, proposed as the second process underlying enculturation."
digital_relationship: "Modelled explicitly by systems that assign probabilities to continuations, from which information content and entropy are computed."
best_use: "Making clear that a listener expects a range of continuations with different likelihoods, not one continuation."
technologies: ["variable-order Markov models", "music prediction models"]
