id: "beat-perception"
term: "Beat Perception"
domain: "rhythm-time"
definition: "Inference of a regular underlying pulse from a rhythmic pattern, associated in imaging work with basal ganglia and supplementary motor area activity even without movement."
digital_relationship: "Approximated by beat-tracking algorithms, which infer a pulse from onsets in a broadly analogous way and fail on broadly analogous material."
best_use: "Naming the inference of a pulse, as distinct from the pattern that induced it."
technologies: ["beat tracking", "fMRI", "tapping tasks"]
