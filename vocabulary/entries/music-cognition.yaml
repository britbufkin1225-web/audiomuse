id: "expectancy"
term: "Expectancy"
domain: "music-theory"
definition: "The anticipation a listener forms about how music will continue, built from exposure to a style, which the music can confirm, delay, omit, or violate."
digital_relationship: "Manipulable by any operation that changes when something arrives, which puts sequencing, editing, and temporal DSP in the same category as harmony."
best_use: "Naming the listener's prediction, as distinct from what the score says should happen next."
