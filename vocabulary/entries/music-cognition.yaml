id: "statistical-learning"
term: "Statistical Learning"
domain: "psychoacoustics"
definition: "Acquisition of a musical system's regularities through ordinary exposure rather than instruction, proposed as one of the two processes underlying enculturation."
digital_relationship: "The human counterpart of what a trained model does with a corpus, which is a useful analogy and not an identity."
best_use: "Explaining why style conventions feel like rules to a listener who was never taught them."
