id: "enculturation"
term: "Enculturation"
domain: "psychoacoustics"
definition: "Acquisition of a musical culture's regularities through exposure, which shapes what a listener expects, hears as structured, and finds pleasant."
digital_relationship: "Invisible to any analysis of the audio, and the reason a model trained on one corpus generalizes poorly to another tradition."
best_use: "Naming learned musical competence acquired without instruction."
technologies: ["exposure studies", "cross-cultural listening tests"]
