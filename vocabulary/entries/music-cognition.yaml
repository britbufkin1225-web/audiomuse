---
id: "entropy"
term: "Entropy"
domain: "psychoacoustics"
definition: "A measure of the uncertainty of a prediction before the next event is heard, maximal when all continuations are equally likely and minimal when one dominates."
digital_relationship: "Computed from the whole predicted distribution rather than from the outcome, which is what distinguishes it from information content."
best_use: "Describing a passage that keeps the listener unsure, as opposed to one that delivers something unexpected."
technologies: ["music prediction models", "corpus analysis"]
node_refs: ["predictive-processing-music", "musical-expectation"]
session_refs: []
