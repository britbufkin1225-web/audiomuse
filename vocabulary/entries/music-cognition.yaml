id: "prediction-error"
term: "Prediction Error"
domain: "psychoacoustics"
definition: "The difference between what was predicted and what arrived, proposed as the quantity that drives learning and reward responses rather than the event itself."
digital_relationship: "Not computable from audio alone, since it depends on a model of what a particular listener expected."
best_use: "Naming the mismatch specifically, rather than describing an event as surprising in the abstract."
technologies: ["computational models of expectation", "neuroimaging"]
