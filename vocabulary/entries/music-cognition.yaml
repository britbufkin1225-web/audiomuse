id: "music-emotion-recognition"
term: "Music Emotion Recognition"
domain: "machine-audio"
definition: "The machine-learning task of predicting emotion labels for music from audio features and annotated training data, which infers labels rather than detecting feeling."
digital_relationship: "Trained on averaged subjective annotations, most often of perceived rather than felt emotion, so its ground truth carries the subjectivity it is meant to resolve."
best_use: "Describing what such a system outputs, without implying that anything was measured or experienced."
technologies: ["MIR toolkits", "supervised learning", "annotation platforms"]
