id: "beatmatching"
term: "Beatmatching"
domain: "dj-turntablism"
definition: "Aligning the tempo and beat positions of two recordings so that they can play together in time."
digital_relationship: "Depends on a track's beatgrid and detected BPM, so an incorrect grid can break synchronization even when the audio itself is intact."
best_use: "Playing two records together in time before and during a transition."
