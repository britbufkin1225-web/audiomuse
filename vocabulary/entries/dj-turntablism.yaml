id: "scratching"
term: "Scratching"
domain: "dj-turntablism"
definition: "Manual manipulation of a record's playback position, velocity, and direction by hand, combined with amplitude gating at the mixer."
digital_relationship: "Equivalent to driving a sample player's transport in real time: hand velocity sets playback rate, direction reverses waveform traversal, and the fader gates the output."
best_use: "Turning a recorded fragment into a rhythmically articulated, frequency-shifted performance gesture."
