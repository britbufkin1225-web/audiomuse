id: "breakbeat"
term: "Breakbeat"
domain: "dj-turntablism"
definition: "A rhythmic break isolated from a record and extended or repeated, originally by alternating two copies of the same release."
digital_relationship: "Became straightforward once samplers could store, loop, and re-trigger the fragment that two turntables had previously extended by hand."
best_use: "Building an extended rhythmic section out of a short passage inside an existing recording."
