id: "vinyl"
term: "Vinyl"
domain: "dj-turntablism"
definition: "A record whose spiral groove stores audio as a physical shape that a stylus can trace, and that a performer can move by hand."
digital_relationship: "Exposes playback position physically rather than as a file offset, and the same medium can instead carry a timecode signal that drives digital audio."
best_use: "Playing, cueing, and manually manipulating recorded audio as a physical object."
