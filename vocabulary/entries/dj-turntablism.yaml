id: "digital-vinyl-system"
term: "Digital Vinyl System (DVS)"
domain: "dj-turntablism"
definition: "A DJ system in which timecode records played on ordinary turntables control the playback of digital audio files."
digital_relationship: "Converts stylus motion into position, speed, and direction data that drives a software deck, so vinyl mechanics stay in the loop while the audio stays digital."
best_use: "Playing and scratching a digital library without giving up the turntable interface."
technologies: ["turntables", "timecode records", "audio interfaces", "DJ software"]
