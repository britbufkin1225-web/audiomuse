id: "timecode-vinyl"
term: "Timecode Vinyl"
domain: "dj-turntablism"
definition: "A record whose groove carries a control signal instead of music, so that its motion can be read as playback position and speed."
digital_relationship: "Decoded by DJ software into transport control for a digital file, making the groove data about motion rather than the audio being heard."
best_use: "Driving a digital deck from a real turntable while keeping normal cueing and scratching gestures."
