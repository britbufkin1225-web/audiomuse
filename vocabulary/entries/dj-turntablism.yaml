id: "phrase-matching"
term: "Phrase Matching"
domain: "dj-turntablism"
definition: "Aligning two recordings at the level of musical sections and phrase boundaries rather than only at individual beats."
digital_relationship: "Relies on bar and phrase counting above the beatgrid, and on cue points or markers placed at structural boundaries."
best_use: "Making a transition land where both tracks change section, so the mix follows structure and not only tempo."
