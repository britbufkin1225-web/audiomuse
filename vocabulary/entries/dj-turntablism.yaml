id: "crossfader"
term: "Crossfader"
domain: "dj-turntablism"
definition: "A mixer control that moves audibility between two channels, and in turntablism a gate deciding whether manipulated audio is heard at all."
digital_relationship: "Implemented as a gain law across two signal paths, with adjustable curves that trade smooth blending against fast on-off cutting."
best_use: "Blending between two recordings, or cutting a moving record into discrete rhythmic events."
