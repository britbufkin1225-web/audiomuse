id: "piloerection"
term: "Piloerection"
domain: "psychoacoustics"
definition: "Involuntary raising of body hair, sometimes accompanying frisson, whose status as definitional or merely associated is disputed in the literature."
digital_relationship: "A bodily measure with no signal counterpart; recording it requires observation or specialized instrumentation rather than audio analysis."
best_use: "Naming the physical sign precisely, and noting that its relationship to the reported experience is unsettled."
