id: "autonomic-response"
term: "Autonomic Response"
domain: "psychoacoustics"
definition: "Involuntary bodily change such as altered heart rate, skin conductance, respiration, or pupil size, which is evidence of a response without being equivalent to a felt emotion."
digital_relationship: "Measured with instrumentation entirely separate from the audio chain, and never inferable from the signal."
best_use: "Reporting what was physically measured, kept apart from what the listener said they felt."
