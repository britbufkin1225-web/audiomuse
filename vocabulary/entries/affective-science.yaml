id: "evaluative-conditioning"
term: "Evaluative Conditioning"
domain: "psychoacoustics"
definition: "A proposed mechanism in which a piece acquires affective value through repeated pairing with something positive or negative, described as subconscious, unintentional, and effortless."
digital_relationship: "Independent of any signal property, which is why a musically unremarkable recording can carry a strong response for one listener and none for another."
best_use: "Explaining acquired affective value that no acoustic analysis would predict."
technologies: ["repeated exposure", "media pairing"]
