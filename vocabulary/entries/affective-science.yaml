id: "emotional-contagion"
term: "Emotional Contagion"
domain: "psychoacoustics"
definition: "A proposed mechanism in which a listener perceives an emotional expression in music and internally mimics it, drawing on responses to voice-like features."
digital_relationship: "Relevant wherever processing makes material more or less voice-like, including formant shifting, resampling, and vocoding."
best_use: "Naming one specific proposed route from expression to feeling, rather than treating expression and feeling as the same thing."
