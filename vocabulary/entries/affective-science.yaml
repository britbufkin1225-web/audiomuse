id: "autobiographical-salience"
term: "Autobiographical Salience"
domain: "psychoacoustics"
definition: "How strongly a piece of music is bound to a listener's own past, measured separately from familiarity and shown to have effects beyond what familiarity alone predicts."
digital_relationship: "A per-listener variable that no property of the file carries, and one that must be controlled in any listening test using known material."
best_use: "Separating knowing a song from the song meaning something to you."
