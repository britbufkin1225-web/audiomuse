id: "felt-emotion"
term: "Felt Emotion"
domain: "psychoacoustics"
definition: "The emotion a listener actually experiences in response to music, as distinct from the emotion they hear it as expressing."
digital_relationship: "Rarely the target of automatic systems, because it depends on listener and situation in ways a recording does not determine."
