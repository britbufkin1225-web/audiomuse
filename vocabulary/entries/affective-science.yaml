id: "familiarity"
term: "Familiarity"
domain: "psychoacoustics"
definition: "How well a listener knows a piece of music, which affects neural tracking, physiological response, and rated experience, and which confounds any listening test that does not control it."
digital_relationship: "Not a property of the audio; two listeners hearing the same file are running different experiments."
best_use: "Naming the variable a listening test has to control before its results mean anything."
