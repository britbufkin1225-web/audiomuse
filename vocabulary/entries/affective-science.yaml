id: "episodic-memory"
term: "Episodic Memory"
domain: "psychoacoustics"
definition: "Memory for a specific personal event, which music can cue, bringing the emotion associated with the event along with the recollection."
digital_relationship: "Attaches to a particular recording rather than to a composition, which is why a cover version often does not work as a cue."
best_use: "Distinguishing a response caused by the listener's history from one caused by the sound."
