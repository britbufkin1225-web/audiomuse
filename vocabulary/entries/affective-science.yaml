id: "frisson"
term: "Frisson"
domain: "psychoacoustics"
definition: "A transient peak response reported as chills, shivers, tingling, or piloerection, accompanied by autonomic change and used in research as a marker of intense response."
digital_relationship: "Not producible on demand by any signal manipulation; the structural triggers reported in the literature are correlational and sample-limited."
best_use: "Naming the marker researchers actually measure, rather than treating it as a synonym for being moved."
technologies: ["skin conductance", "piloerection recording", "continuous response interfaces"]
