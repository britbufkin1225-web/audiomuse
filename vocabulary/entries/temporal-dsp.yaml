id: "inter-onset-interval"
term: "Inter-Onset Interval"
domain: "rhythm-time"
definition: "The time between the starts of two successive events, which is the quantity a listener uses to infer pulse and the quantity temporal displacement alters."
digital_relationship: "Directly measurable from detected onsets and directly editable in any sequencer, which makes it the natural unit for describing timing deviation."
best_use: "Stating a timing relationship as a duration between starts rather than as a note value."
technologies: ["onset detection", "MIDI timing", "DAW grid", "tapping tasks"]
node_refs: ["temporal-displacement", "rhythm", "rhythmic-entrainment"]
