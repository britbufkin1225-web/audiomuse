id: "granular-fragmentation"
term: "Granular Fragmentation"
domain: "dsp"
definition: "Decomposition of a signal into very short windowed segments that can be repositioned, repeated, overlapped, and randomized independently of the source's own structure."
digital_relationship: "Requires random access and windowing; the grain schedule is generated rather than found, which is what separates it from slicing."
best_use: "Naming processing whose unit is shorter than an event, where grain scheduling rather than content determines the result."
technologies: ["granular synthesizer", "granular delay", "time-stretch algorithms", "DAW warping"]
node_refs: ["granular-fragmentation", "time-stretching", "timbre"]
session_refs: ["session-03-history-of-electronic-music"]
related_terms: ["grain", "grain-density", "micro-looping", "time-stretching"]
tags: ["dsp", "synthesis", "time-domain"]
---
id: "grain"
term: "Grain"
domain: "dsp"
definition: "A single short windowed segment of audio used as the unit of granular processing, short enough that its window shape substantially determines its spectrum."
digital_relationship: "Defined by a length and a window function; at very short lengths the window rather than the source dominates what is heard."
best_use: "Reasoning about why a very short fragment does not sound like a short version of its source."
technologies: ["granular synthesizer", "windowing functions", "phase vocoder frames"]
