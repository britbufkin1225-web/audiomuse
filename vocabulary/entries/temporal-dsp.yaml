id: "onset-density"
term: "Onset Density"
domain: "rhythm-time"
definition: "The number of perceptual event starts per unit time, which temporal operations change directly and which determines how busy a passage is independently of its level."
digital_relationship: "Computable from an onset detection function, and manipulable by any operation that adds, removes, or subdivides events."
best_use: "Describing busyness as a countable property rather than as an impression."
technologies: ["onset detection", "sampler", "step sequencer", "DAW editing"]
node_refs: ["retriggering", "gating", "rhythm"]
