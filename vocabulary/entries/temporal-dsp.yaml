id: "temporal-displacement"
term: "Temporal Displacement"
domain: "rhythm-time"
definition: "Placement of an event earlier or later than the position a listener predicts, at scales from microtiming to phrase-level anticipation, which changes felt rhythm without changing which events occur."
digital_relationship: "Expressed as an offset from a grid in a sequencer, where the grid is explicit; in performance the reference is the pulse a listener has inferred, which is not."
best_use: "Naming the variable that swing, push, drag, and syncopation are all instances of."
technologies: ["DAW quantize strength", "groove templates", "MPC swing", "turntable"]
node_refs: ["temporal-displacement", "groove", "musical-expectation"]
session_refs: ["session-02-what-is-music"]
related_terms: ["swing", "syncopation", "groove", "inter-onset-interval"]
tags: ["rhythm-time", "structure"]
---
id: "syncopation"
term: "Syncopation"
domain: "rhythm-time"
definition: "Systematic placement of accents away from the positions an inferred metre predicts, which contradicts the metre without displacing it."
digital_relationship: "Trivially programmable, and measurable by published syncopation indices computed from a pattern against a metrical hierarchy."
best_use: "Describing contradiction of an inferred metre, as distinct from any deviation from a grid."
technologies: ["step sequencer", "drum machine", "DAW piano roll"]
