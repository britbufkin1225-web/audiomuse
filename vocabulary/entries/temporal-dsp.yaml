id: "gate-rate"
term: "Gate Rate"
domain: "dsp"
definition: "How often a gate opens per unit time, which determines whether the result is heard as phrasing, as rhythm, or as timbral modulation."
digital_relationship: "Usually set as a musical division in a DAW, which hides the fact that it is a frequency and can be driven into the audio range."
best_use: "Reasoning about a gate as a modulation frequency rather than as a note value."
technologies: ["LFO", "step sequencer", "trance gate", "tremolo"]
