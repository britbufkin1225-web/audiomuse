id: "retriggering"
term: "Retriggering"
domain: "dsp"
definition: "Restarting a sample or event before it completes, truncating its envelope and replacing it with a new attack, which raises onset density and changes apparent identity without editing the source."
digital_relationship: "A voice-allocation and envelope decision in a sampler; on turntables the equivalent is re-striking a cued record by hand."
best_use: "Naming what happens to the tail of a sound, not only what happens to its start."
technologies: ["sampler", "drum machine", "MPC-style pads", "MIDI note repeat"]
node_refs: ["retriggering", "sampling", "amplitude-envelope"]
session_refs: ["session-03-history-of-electronic-music"]
