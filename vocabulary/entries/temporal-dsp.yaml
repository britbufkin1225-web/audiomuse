id: "stutter"
term: "Stutter"
domain: "dsp"
definition: "Rapid repetition of a short fragment at a period set independently of the source material, so that the repeat rate rather than the fragment content becomes the dominant perceptual variable."
digital_relationship: "Produced by a beat-repeat effect, a re-triggered sampler, or a buffer loop, where the repeat period can be set exactly and swept continuously."
best_use: "Naming fast repetition whose rate is the point, as distinct from a musical repeat of a phrase."
technologies: ["beat repeat", "buffer effect", "sampler", "DJ loop roll"]
node_refs: ["stutter", "repetition", "micro-looping"]
session_refs: ["session-02-what-is-music"]
related_terms: ["micro-looping", "retriggering", "gating", "repetition", "modulation-rate"]
tags: ["dsp", "time-domain", "technique"]
---
id: "micro-looping"
term: "Micro-Looping"
domain: "dsp"
definition: "Looping of a segment short enough that the loop period itself becomes a perceptual variable, carrying material from rhythm through flutter and buzz toward perceived pitch as the period shortens."
digital_relationship: "Trivial once audio is randomly addressable; the loop rate is a frequency, and a hard loop point generates broadband content at every repetition."
best_use: "Describing the continuum between rhythmic repetition and pitched periodicity as one variable rather than two domains."
technologies: ["sampler loop points", "buffer effect", "granular processor", "DAW loop region"]
node_refs: ["micro-looping", "roughness", "pitch"]
session_refs: ["session-01-what-is-sound"]
related_terms: ["stutter", "granular-fragmentation", "modulation-rate", "repetition"]
tags: ["dsp", "time-domain", "spectral"]
