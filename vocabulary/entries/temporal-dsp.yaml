id: "modulation-rate"
term: "Modulation Rate"
domain: "psychoacoustics"
definition: "The frequency at which a signal property varies periodically, which determines the perceptual category of the result: pulsation at low rates, roughness in a middle band, and resolved sidebands above it."
digital_relationship: "The rate of any LFO, gate, stutter, or loop, which means a musical repeat and a timbral modulation are the same parameter at different settings."
best_use: "Reasoning about repeat rate and modulation depth as one continuum rather than as separate techniques."
technologies: ["LFO", "tremolo", "gate", "beat repeat", "granular scheduling"]
