---
id: "duty-cycle"
term: "Duty Cycle"
domain: "dsp"
definition: "The proportion of each gate period during which the signal is open, which determines how much of the source survives and whether the result reads as continuous material with holes or as separate events."
digital_relationship: "Exposed directly as gate width or pulse width in synthesizers and step gates; on a crossfader it is the fraction of the cycle the fader spends open."
best_use: "Separating how often a gate opens from how long it stays open, which are independent perceptual variables."
technologies: ["pulse width control", "step gate", "DJ crossfader", "trance gate"]
