id: "dropout"
term: "Dropout"
domain: "dsp"
definition: "Sudden removal of expected material, whose effect depends on the strength of the prediction it breaks rather than on its own duration."
digital_relationship: "A mute, a gate closure, or an arrangement decision; identical in signal terms to silence, and completely different in perceptual terms because of what preceded it."
best_use: "Describing an absence that arrives, as opposed to material that was never there."
technologies: ["DAW mute automation", "DJ mixer kill switch", "gate", "arrangement"]
