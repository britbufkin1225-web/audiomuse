id: "gating"
term: "Gating"
domain: "dsp"
definition: "Opening and closing a signal path according to a separate control signal, so that material present in the source is heard only during the open intervals."
digital_relationship: "Implemented as a threshold detector, an envelope follower, an LFO, or a step pattern; the crossfader performs the same operation by hand."
best_use: "Describing amplitude switched on and off on a schedule, as distinct from level being reduced continuously."
technologies: ["noise gate", "trance gate", "DJ crossfader", "sidechain compressor", "DAW clip gain"]
node_refs: ["gating", "amplitude-envelope", "temporal-discontinuity"]
