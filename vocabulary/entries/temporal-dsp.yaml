id: "temporal-discontinuity"
term: "Temporal Discontinuity"
domain: "dsp"
definition: "An abrupt break in signal continuity that functions at once as a spectral event, a grouping boundary, and a failure of prediction."
digital_relationship: "Produced by any hard cut in the digital domain, where an instantaneous amplitude step is broadband and audible as a click unless a short fade is applied."
best_use: "Explaining why a cut does three things at once instead of only removing audio."
technologies: ["DAW editing", "sampler slicing", "DJ crossfader", "gate"]
node_refs: ["temporal-discontinuity", "musical-expectation", "amplitude-envelope"]
