---
id: "temporal-dsp"
term: "Temporal DSP"
domain: "dsp"
definition: "The family of signal operations that restructure material in time rather than in frequency, including gating, chopping, stuttering, looping, retriggering, dropout, displacement, and granular fragmentation."
digital_relationship: "Native to samplers and DAWs, where any point in a file is instantly addressable; the mechanical ancestors are the crossfader, the tape splice, and two copies of one record."
best_use: "Naming the layer between waveform manipulation and musical expectation, rather than listing the operations individually."
technologies: ["sampler", "DAW", "DJ mixer", "step sequencer", "granular processor"]
