id: "grain-density"
term: "Grain Density"
domain: "dsp"
definition: "The rate at which grains are scheduled, which determines whether the result is heard as a sequence of small events, as texture, or as a pitch at the grain rate."
digital_relationship: "A generator parameter with no counterpart in the source material; regular scheduling produces periodicity and jittered scheduling suppresses it."
best_use: "Explaining how one control moves granular output between rhythm, noise, and tone."
technologies: ["granular synthesizer", "granular delay", "particle processors"]
