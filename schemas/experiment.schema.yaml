schema: audiomuse-experiment
version: 1
description: Canonical contract for reproducible AudioMuse listening and measurement exercises.
required: [id, title, status, type, difficulty, purpose, node_refs, vocabulary_refs, session_refs, source_refs, required_equipment, optional_equipment, safety, setup, procedure, observations, measurements, expected_behavior, interpretation, limitations, repeatability, related_experiments, project_connections]
properties:
  id: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
  title: { type: string }
  status: { type: string, enum: [proof, established] }
  type: { type: string, enum: [listening, visualization, hybrid] }
  difficulty: { type: string, enum: [introductory, intermediate] }
  purpose: { type: string }
  node_refs: { type: array, items: { type: string } }
  vocabulary_refs: { type: array, items: { type: string } }
  session_refs: { type: array, items: { type: string } }
  source_refs: { type: array, items: { type: string } }
  required_equipment: { type: array, items: { type: string } }
  optional_equipment: { type: array, items: { type: string } }
  safety: { type: array, items: { type: string } }
  setup: { type: array, items: { type: string } }
  procedure: { type: array, items: { type: string } }
  observations: { type: array, items: { type: string } }
  measurements: { type: array, items: { type: string } }
  expected_behavior: { type: array, items: { type: string } }
  interpretation: { type: array, items: { type: string } }
  limitations: { type: array, items: { type: string } }
  repeatability: { type: array, items: { type: string } }
  related_experiments: { type: array, items: { type: string } }
  project_connections: { type: array, items: { type: string } }
additional_properties: false
